# Every push and pull request: the Go server and PC app tests against a real
# Postgres with every migration, the app contract fixtures checked against
# what the server really sends, then the Flutter app's analysis and tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: WholeFlow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: WholeFlow/go.mod
          cache-dependency-path: WholeFlow/go.sum
      - name: Postgres client
        run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - name: go vet
        run: go vet ./...
      - name: Migrations and SQL tests (throwaway Postgres in Docker)
        run: db/tests/run_local.sh
      - name: Save the committed contract fixtures
        working-directory: .
        run: cp -r wholeflow_app/test/fixtures/api "$RUNNER_TEMP/fixtures-committed"
      - name: Go tests, including the database integration tests
        env:
          WF_TEST_PG: postgres://postgres:pw@127.0.0.1:55432/wf
          WF_WRITE_FIXTURES: "1"
        run: go test -count=1 ./...
      # Ids and times differ on every run, so the fixtures are compared by
      # shape: the same files, and in each the same keys and value types.
      - name: App contract fixtures match the server
        working-directory: .
        run: |
          shape='[paths(type != "object" and type != "array") as $p | [($p | map(if type == "number" then "#" else . end)), (getpath($p) | type)]] | unique'
          fail=0
          for f in "$RUNNER_TEMP"/fixtures-committed/*.json wholeflow_app/test/fixtures/api/*.json; do
            n=$(basename "$f")
            a="$RUNNER_TEMP/fixtures-committed/$n" b="wholeflow_app/test/fixtures/api/$n"
            if [ ! -f "$a" ] || [ ! -f "$b" ]; then echo "::error::fixture $n added or removed"; fail=1; continue; fi
            if ! diff <(jq -c "$shape" "$a") <(jq -c "$shape" "$b") >/dev/null; then
              echo "::error::fixture $n changed shape: run the integration test with WF_WRITE_FIXTURES=1 and commit"; fail=1
            fi
          done
          exit $fail
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  app:
    needs: server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wholeflow_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib || { echo "::error::Run build_runner and commit the generated files"; exit 1; }
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
