<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WholeFlow · Tally Dashboard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">WholeFlow <span class="muted">from TallyPrime</span></div>
  <nav>
    <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
    <a href="#/shops" data-nav="shops">Shops</a>
    <a href="#/outstanding" data-nav="outstanding">Outstanding</a>
    <a href="#/suppliers" data-nav="suppliers">Suppliers</a>
    <a href="#/purchases" data-nav="purchases">Purchases</a>
    <a href="#/inventory" data-nav="inventory">Inventory</a>
    <a href="#/status" data-nav="status">Tally Status</a>
    <a href="#/sync" data-nav="sync">Cloud Sync</a>
  </nav>
  <div class="tools">
    <span id="conn" class="pill">Checking…</span>
    <a id="syncpill" class="pill" href="#/sync" hidden></a>
    <select id="company" title="Company" hidden></select>
    <button id="refresh" class="primary" title="Pull the latest data from TallyPrime">Refresh from Tally</button>
    <button id="logout" title="Log out" hidden>Log out</button>
  </div>
</header>
<div id="asof" class="asof"></div>
<main id="view"></main>
<script src="app.js"></script>
</body>
</html>
