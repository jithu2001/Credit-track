# Installed by scripts/setup-users.sh as
# /etc/systemd/journald.conf.d/wholeflow.conf.
# The WholeFlow services log to the journal; their logs can contain personal
# data (sign-in e-mail addresses, client IPs). Keep them 90 days at most and
# cap the disk they use. See README "Logs and personal data".
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=90day
