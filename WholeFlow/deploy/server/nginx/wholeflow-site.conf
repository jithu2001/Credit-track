# Product website: https://wholeflow.jitsuji.xyz (static files from the repo's
# website/ folder, copied to /var/www/wholeflow-site by website/deploy.sh).
# Linked into /etc/nginx/sites-enabled. The HTTPS lines were added by
#   certbot --nginx -d wholeflow.jitsuji.xyz --redirect
# (certificate renews itself with certbot.timer). Copy changes made on the
# server back into the repo.
server {
    server_name wholeflow.jitsuji.xyz;

    root /var/www/wholeflow-site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The site loads nothing from other hosts; JSON-LD is data, not script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Files are not fingerprinted: pages are re-checked on every visit, CSS/JS
    # weekly, images and fonts monthly. `expires` keeps the headers above.
    location ~* \.html$ { expires -1; }
    location ~* \.(css|js)$ { expires 7d; }
    location ~* \.(webp|png|ico|svg|woff2)$ { expires 30d; }

    # Contact form: forwarded to the control service, which stores it for the
    # admin app (Enquiries). X-Real-IP keeps its per-visitor limits working.
    location = /api/contact {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100/control/leads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wholeflow.jitsuji.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wholeflow.jitsuji.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = wholeflow.jitsuji.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wholeflow.jitsuji.xyz;
    return 404; # managed by Certbot


}