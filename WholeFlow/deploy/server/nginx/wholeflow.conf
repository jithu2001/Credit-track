# WholeFlow public entry point. HTTPS is added by certbot once DNS points here.
# Requests to the bare IP or unknown names are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# API: control service and one /b/<slug>/ block per business (included).
server {
    server_name api.jitsuji.xyz;

    client_max_body_size 10m;

    # Control service: reference keys, PC activation, admin API.
    location /control/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15m;  # creating a business runs the provisioning script
    }

    # Staff management for every business (one service).
    location ~ "^/b/[a-z][a-z0-9]{1,19}/functions/v1/" {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/wholeflow-businesses/*.conf;

    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.jitsuji.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.jitsuji.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Admin web app: pages and API are both served by the control service.
server {
    server_name admin.jitsuji.xyz;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only the admin app's pages and its API (not the phone/PC endpoints).
    location ~ ^/(assets/|control/admin/|$) {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15m;  # creating a business, backups, update all
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.jitsuji.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.jitsuji.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.jitsuji.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.jitsuji.xyz;
    return 404; # managed by Certbot


}
server {
    if ($host = admin.jitsuji.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name admin.jitsuji.xyz;
    return 404; # managed by Certbot


}