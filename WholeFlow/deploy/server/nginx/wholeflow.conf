# WholeFlow public entry point. HTTPS is added by certbot once DNS points here.
# Linked into /etc/nginx/sites-enabled, so everything at the top level of this
# file is in nginx's http{} context (rate-limit zones below).

# ---------------------------------------------------------------- rate limits
# Per client IP. Over the limit nginx answers 429 (limit_req_status in each
# server). Mobile carriers share IPs (CGNAT), so the strict limits only apply
# where guessing matters: password sign-in and the control service's public
# endpoints (reference keys, activation codes, PC login).
#
# Password sign-in (POST .../auth/v1/token?grant_type=password) and admin login.
# An empty key is not counted, so refresh-token grants fall through to wf_token.
map $arg_grant_type $wf_login_key {
    password $binary_remote_addr;
    default  "";
}
map $arg_grant_type $wf_token_key {
    password "";
    default  $binary_remote_addr;
}
limit_req_zone $wf_login_key        zone=wf_login:10m   rate=10r/m;
limit_req_zone $wf_token_key        zone=wf_token:10m   rate=60r/m;
# /control/ public endpoints (connect, activate, heartbeat, pc/login) and the
# website's contact form.
limit_req_zone $binary_remote_addr  zone=wf_control:10m rate=10r/m;
# The app API (phones): screens fire a few requests at once.
limit_req_zone $binary_remote_addr  zone=wf_api:10m     rate=10r/s;
# Tally PC sync: one PC uploads many batches back to back. Generous; only
# stops a runaway loop.
limit_req_zone $binary_remote_addr  zone=wf_pc:10m      rate=50r/s;
# Admin app API (after the optional IP allowlist).
limit_req_zone $binary_remote_addr  zone=wf_admin:10m   rate=10r/s;

# Requests to the bare IP or unknown names are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ----------------------------------------------------------------- api.<domain>
# App API (every business at /b/<slug>/), PC/phone endpoints of the control
# service. The admin API and the control service's internal endpoints are NOT
# reachable here (they are on admin.<domain> only, or nowhere).
server {
    server_name api.jitsuji.xyz;

    # 10m as before: older Tally PCs still post through the legacy /rest/v1/
    # routes. The app API itself takes 64 KB (sign-in) to a few hundred KB.
    client_max_body_size 10m;
    limit_req_status 429;
    proxy_read_timeout 60s;

    # Headers for every response (no add_header inside locations, or these
    # are dropped for that location).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Inherited by every location below that sets no proxy_set_header itself.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Never public: the admin API (it lives on admin.<domain>) and the internal
    # endpoints (/control/internal/tenant/<slug> returns a business's service
    # key). ^~ makes these win over /control/ and over every regex location.
    location ^~ /control/admin/ {
        return 404;
    }
    location ^~ /control/internal/ {
        return 404;
    }

    # Control service, public part: reference keys (connect), PC activation,
    # heartbeat, PC login, health.
    location /control/ {
        limit_req zone=wf_control burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    # Regex locations are tried in file order: specific ones first.

    # Sign-in (password and refresh-token grants) for every business, in
    # GoTrue's format, served by the app API.
    location ~ "^/b/[a-z][a-z0-9]{1,19}/auth/v1/token$" {
        limit_req zone=wf_login burst=20 nodelay;
        limit_req zone=wf_token burst=60 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    # The rest of sign-in (user, logout, health). A regex location, so it wins
    # over the legacy per-business /b/<slug>/auth/v1/ routes (included below)
    # until those are removed (scripts/retire-containers.sh).
    location ~ "^/b/[a-z][a-z0-9]{1,19}/auth/v1/" {
        limit_req zone=wf_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    # Tally PC sync (PC 0.6.0+): big batches (the API accepts up to 16 MB) and
    # many requests in a row.
    location ~ "^/b/[a-z][a-z0-9]{1,19}/api/v1/pc/" {
        client_max_body_size 16m;
        limit_req zone=wf_pc burst=500 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    # App API for every business (phones; docs/API_PLAN.md).
    location ~ "^/b/[a-z][a-z0-9]{1,19}/api/v1/" {
        limit_req zone=wf_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8300;
    }

    # LEGACY: per-business GoTrue/PostgREST routes (/b/<slug>/auth/v1/,
    # /b/<slug>/rest/v1/) written by the old new-business.sh. PostgREST accepts
    # the same service key as the API, so remove them once every Tally PC runs
    # 0.6.0: scripts/retire-containers.sh stop postgrest, later remove --yes.
    include /etc/nginx/wholeflow-businesses/*.conf;

    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.jitsuji.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.jitsuji.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# --------------------------------------------------------------- admin.<domain>
# Admin web app: pages and API are both served by the control service.
server {
    server_name admin.jitsuji.xyz;

    client_max_body_size 1m;
    limit_req_status 429;
    proxy_read_timeout 60s;

    # Optional: only let listed IPs reach the admin app (everyone else gets
    # 403). Copy templates/admin-allowlist.conf.example to
    # /etc/nginx/wholeflow-admin-allow.conf, put your IPs in, uncomment the
    # next line, then: nginx -t && systemctl reload nginx. (Leave it commented
    # until the file exists: a missing include fails nginx -t.)
    # include /etc/nginx/wholeflow-admin-allow.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The admin app's page and its files.
    location = / {
        proxy_pass http://127.0.0.1:8100;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:8100;
    }

    # Sign-in and two-factor set-up: strict, like the app's password sign-in.
    location = /control/admin/login {
        limit_req zone=wf_control burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location ^~ /control/admin/2fa/ {
        limit_req zone=wf_control burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    # Slow admin actions: creating a business runs the provisioning script,
    # "update all" migrates every business, a backup download runs pg_dump
    # (up to 10 min), deleting a business takes a final backup first.
    location = /control/admin/businesses {
        limit_req zone=wf_admin burst=40 nodelay;
        proxy_read_timeout 15m;
        proxy_pass http://127.0.0.1:8100;
    }
    location = /control/admin/migrate-all {
        limit_req zone=wf_admin burst=40 nodelay;
        proxy_read_timeout 15m;
        proxy_pass http://127.0.0.1:8100;
    }
    location ~ "^/control/admin/businesses/[^/]+/(backup|delete)$" {
        limit_req zone=wf_admin burst=40 nodelay;
        proxy_read_timeout 15m;
        proxy_pass http://127.0.0.1:8100;
    }

    # Everything else of the admin API.
    location /control/admin/ {
        limit_req zone=wf_admin burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.jitsuji.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.jitsuji.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.jitsuji.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.jitsuji.xyz;
    return 404; # managed by Certbot


}
server {
    if ($host = admin.jitsuji.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name admin.jitsuji.xyz;
    return 404; # managed by Certbot


}
