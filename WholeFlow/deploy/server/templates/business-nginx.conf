# LEGACY (before the WholeFlow app API). New businesses no longer get this
# file: scripts/new-business.sh creates no containers and no route. Existing
# copies live in /etc/nginx/wholeflow-businesses/<slug>.conf, included by the
# api server block, and point at that business's GoTrue (auth) and PostgREST
# (rest) containers. PostgREST accepts the business's service key, the same
# secret the app API accepts, so these routes are an extra way in: retire them
# after the switch (scripts/retire-containers.sh stop postgrest disables them,
# remove --yes deletes them). /b/<slug>/auth/v1/ here is already shadowed by
# the app API's regex location in nginx/wholeflow.conf.
location /b/__SLUG__/auth/v1/ {
    proxy_pass http://127.0.0.1:__AUTH_PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /b/__SLUG__/rest/v1/ {
    proxy_pass http://127.0.0.1:__REST_PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
