# Business __SLUG__: login, data API and staff service paths under /b/__SLUG__/ (included by the api server block).
location /b/__SLUG__/auth/v1/ {
    proxy_pass http://127.0.0.1:__AUTH_PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /b/__SLUG__/rest/v1/ {
    proxy_pass http://127.0.0.1:__REST_PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
